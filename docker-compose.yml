services:
  app:
    image: ${APP_IMAGE:-ghcr.io/paperized/quiz-gpt:latest}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/itas-zscaler-root-ca.pem
      PORT: ${PORT}
      PUBLIC_URL: ${PUBLIC_URL}
      LOG_LEVEL: ${LOG_LEVEL:-}
      BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-}
      GENERATE_RATE_LIMIT_MAX_REQUESTS: ${GENERATE_RATE_LIMIT_MAX_REQUESTS:-}
      DATABASE_URL: ${DATABASE_URL}
      LLM_API_STYLE: ${LLM_API_STYLE}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE}
      ANTHROPIC_VERSION: ${ANTHROPIC_VERSION}
      EMBEDDING_API_STYLE: ${EMBEDDING_API_STYLE}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      MAX_EMBEDDING_CANDIDATES: ${MAX_EMBEDDING_CANDIDATES}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      MAX_RETRIEVED_CHUNKS: ${MAX_RETRIEVED_CHUNKS}
      MAX_RETRIEVED_CHARS: ${MAX_RETRIEVED_CHARS}
    volumes:
      - /home/test/Lavoro/ITAS/tobe/cert.cer:/etc/ssl/certs/itas-zscaler-root-ca.pem:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
