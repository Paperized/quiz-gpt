services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      PUBLIC_URL: http://localhost:3000
      DATABASE_URL: postgresql://learngpt:learngpt@db:5432/learngpt
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_API_KEY: ""
      LLM_MODEL: gpt-4o
      LLM_MAX_TOKENS: 2000
      LLM_TEMPERATURE: 0.7
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learngpt
      POSTGRES_PASSWORD: learngpt
      POSTGRES_DB: learngpt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learngpt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
