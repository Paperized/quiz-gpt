services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      PUBLIC_URL: http://localhost:3000
      DATABASE_URL: postgresql://learngpt:learngpt@db:5432/learngpt
      LLM_API_STYLE: openai
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_API_KEY: ""
      LLM_MODEL: gpt-4o
      LLM_MAX_TOKENS: 2000
      LLM_TEMPERATURE: 0.7
      ANTHROPIC_VERSION: 2023-06-01
      EMBEDDING_API_STYLE: same_as_llm
      EMBEDDING_BASE_URL: ""
      EMBEDDING_API_KEY: ""
      EMBEDDING_MODEL: text-embedding-3-small
      MAX_EMBEDDING_CANDIDATES: 220
      EMBEDDING_BATCH_SIZE: 64
      GITHUB_TOKEN: ""
      MAX_RETRIEVED_CHUNKS: 16
      MAX_RETRIEVED_CHARS: 28000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learngpt
      POSTGRES_PASSWORD: learngpt
      POSTGRES_DB: learngpt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learngpt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
